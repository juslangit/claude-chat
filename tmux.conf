# tmux settings for claude-chat sessions only (they run on their own tmux server, "-L claude-chat").
set -g mouse on                 # scroll back through the conversation with the trackpad
set -g history-limit 50000
set -g status off               # no tmux status bar — looks like a plain Terminal window
set -g escape-time 10           # Esc reaches Claude immediately
set -g window-size latest       # follow whichever Terminal window was used last
set -g default-size "140x45"    # size while no Terminal window is attached
set -g default-terminal "xterm-256color"
set -g set-titles on
set -g set-titles-string "#S"
